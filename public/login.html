<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول — Quotes Pro Admin</title>
  <link rel="icon" href="/images/app_icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .login-shell {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(circle at 0% 0%, rgba(124, 58, 237, 0.4) 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(37, 99, 235, 0.4) 0%, transparent 40%),
        linear-gradient(135deg, #1E40AF 0%, #6D28D9 100%);
      padding: var(--sp-4);
    }
    .login-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      padding: 40px 36px;
      width: 100%; max-width: 440px;
    }
    .login-logo {
      width: 80px; height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%);
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 900;
      margin: 0 auto 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
    }
    .login-title { text-align: center; font-size: 24px; font-weight: 800; color: var(--text-primary); }
    .login-subtitle { text-align: center; font-size: 13px; color: var(--text-secondary); margin-top: 4px; margin-bottom: 24px; }
    .login-foot { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 24px; }
    .form-row-flex { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 24px; }
    .remember-me { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
    .input-group { position: relative; }
    .input-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; font-size: 18px; }
    .input-group .form-control { padding-right: 42px; }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-logo">
        <img src="/images/app_icon.png" alt="Quotes Pro" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.parentElement.textContent='Q';">
      </div>
      <h1 class="login-title">Quotes Pro Admin</h1>
      <p class="login-subtitle">لوحة إدارة تطبيق إنشاء عروض الأسعار</p>

      <div id="loginAlert"></div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="email">البريد الإلكتروني</label>
          <div class="input-group">
            <span class="input-icon">✉</span>
            <input class="form-control" type="email" id="email" required autocomplete="email" placeholder="admin@example.com" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">كلمة المرور</label>
          <div class="input-group">
            <span class="input-icon">🔒</span>
            <input class="form-control" type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
          </div>
        </div>

        <div class="form-row-flex">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" checked />
            <span>تذكرني (البقاء مسجلاً)</span>
          </label>
        </div>

        <button type="submit" class="btn btn--primary btn--block btn--lg" id="btnLogin">
          <span>🔐</span> تسجيل الدخول
        </button>
      </form>

      <p class="login-foot">© 2026 Haddad Inc — Quotes Pro</p>
    </div>
  </div>

<script type="module">
  import { auth, doLogin, signOut, callFunction, toast } from "/js/common.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const alertBox = document.getElementById("loginAlert");
  const urlParams = new URLSearchParams(location.search);
  if (urlParams.get("error") === "not_admin") {
    alertBox.innerHTML = `<div class="alert alert--error mb-4"><span class="alert__icon">⛔</span><div class="alert__body">هذا الحساب لا يملك صلاحية المدير (<code>userType: "admin"</code>).</div></div>`;
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      try {
        const result = await callFunction("checkIsAdmin");
        if (result.isAdmin) {
          location.href = "/";
        } else {
          await signOut(auth);
          alertBox.innerHTML = `<div class="alert alert--error mb-4"><span class="alert__icon">⛔</span><div class="alert__body">هذا الحساب ليس لديه صلاحية الدخول إلى لوحة التحكم.</div></div>`;
        }
      } catch (e) {
        console.error(e);
      }
    }
  });

  const form = document.getElementById("loginForm");
  const btn = document.getElementById("btnLogin");
  const lastEmail = localStorage.getItem("quotes_admin_email");
  if (lastEmail) document.getElementById("email").value = lastEmail;

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const rememberMe = document.getElementById("rememberMe").checked;

    if (!email || !password) {
      alertBox.innerHTML = `<div class="alert alert--warning mb-4">⚠️ يرجى إدخال البريد الإلكتروني وكلمة المرور</div>`;
      return;
    }

    alertBox.innerHTML = "";
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> جاري التحقق...';

    try {
      await doLogin(email, password, rememberMe);
      localStorage.setItem("quotes_admin_email", email);

      const adminCheck = await callFunction("checkIsAdmin");
      if (!adminCheck.isAdmin) {
        await signOut(auth);
        throw new Error("غير مصرح بالدخول: هذا الحساب ليس مديراً (userType != admin).");
      }

      toast("تم تسجيل الدخول بنجاح", "success");
      setTimeout(() => location.href = "/", 300);
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert--error mb-4"><div class="alert__title">فشل الدخول</div>${err.message}</div>`;
      toast(err.message, "error");
      btn.disabled = false;
      btn.innerHTML = '<span>🔐</span> تسجيل الدخول';
    }
  });
</script>
</body>
</html>
