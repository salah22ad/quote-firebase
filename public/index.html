<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم — Quotes Pro Admin</title>
  <link rel="icon" href="/images/app_icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <script type="module">
    import { requireAuth, mountShell, callFunction, toast, escapeHTML } from "/js/common.js";

    (async () => {
      await requireAuth();
      mountShell("/", "لوحة التحكم", "مركز إدارة تطبيق إنشاء عروض الأسعار (Quotes Pro)");
      loadSummary();
    })();

    async function loadSummary() {
      try {
        const result = await callFunction("getDashboardSummary");
        renderHome(result);
      } catch (e) {
        toast("فشل تحميل الملخص: " + e.message, "error");
        renderHome({ totalUsers: 0, totalGuests: 0, premiumUsers: 0, newUsersToday: 0 });
      }
    }

    function renderHome(summary) {
      document.getElementById("pageBody").innerHTML = `
        <div class="hero">
          <h2 class="hero__title">مرحباً بك في Quotes Pro Admin 👋</h2>
          <p class="hero__subtitle">إدارة المشتركين والضيوف، الحصص، والإشعارات المترجمة من مكان واحد</p>
          <div class="hero__chips">
            <div class="hero__chip">👥 ${escapeHTML(summary.totalUsers)} مسجل</div>
            <div class="hero__chip">👤 ${escapeHTML(summary.totalGuests)} ضيف</div>
            <div class="hero__chip">⭐ ${escapeHTML(summary.premiumUsers)} بريميوم</div>
            <div class="hero__chip">🆕 ${escapeHTML(summary.newUsersToday)} جديد اليوم</div>
            <div class="hero__chip">🛡️ userType = admin</div>
          </div>
        </div>

        <div class="stats-grid mb-6">
          <div class="stat-card">
            <div class="stat-card__icon stat-card__icon--blue">👥</div>
            <div>
              <div class="stat-card__value">${escapeHTML(summary.totalUsers)}</div>
              <div class="stat-card__label">المستخدمون المسجلون</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon stat-card__icon--cyan">👤</div>
            <div>
              <div class="stat-card__value">${escapeHTML(summary.totalGuests)}</div>
              <div class="stat-card__label">الضيوف (Guests)</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon stat-card__icon--green">⭐</div>
            <div>
              <div class="stat-card__value">${escapeHTML(summary.premiumUsers)}</div>
              <div class="stat-card__label">مشتركون بريميوم</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon stat-card__icon--purple">🆕</div>
            <div>
              <div class="stat-card__value">${escapeHTML(summary.newUsersToday)}</div>
              <div class="stat-card__label">مستخدمون جدد اليوم</div>
            </div>
          </div>
        </div>

        <h2 class="page-title" style="font-size: 20px; margin-bottom: var(--sp-4);">الإجراءات السريعة</h2>
        <div class="action-grid">
          <a href="/notifications" class="action-card action-card--purple" data-link>
            <div class="action-card__icon">🔔</div>
            <div class="action-card__title">إرسال إشعار مترجم</div>
            <div class="action-card__desc">كتابة الإشعار بالعربية وترجمته وبثه لجميع المستخدمين حسب لغة التطبيق</div>
            <div class="action-card__arrow">فتح ←</div>
          </a>
          <a href="/quota" class="action-card action-card--success" data-link>
            <div class="action-card__icon">🔧</div>
            <div class="action-card__title">إدارة حصة العروض (max_quotes)</div>
            <div class="action-card__desc">تعديل حد عروض الأسعار لقسم users أو guests (الافتراضي 100)</div>
            <div class="action-card__arrow">فتح ←</div>
          </a>
          <a href="/stats" class="action-card action-card--info" data-link>
            <div class="action-card__icon">📊</div>
            <div class="action-card__title">إحصائيات المستخدمين</div>
            <div class="action-card__desc">عرض إجمالي المسجلين والضيوف والجدد والبريميوم</div>
            <div class="action-card__arrow">فتح ←</div>
          </a>
          <a href="/users" class="action-card" data-link>
            <div class="action-card__icon">👥</div>
            <div class="action-card__title">قائمة المشتركين</div>
            <div class="action-card__desc">البحث وعرض بيانات المستخدمين وعدد عروض الأسعار</div>
            <div class="action-card__arrow">فتح ←</div>
          </a>
          <a href="/devices" class="action-card action-card--info" data-link>
            <div class="action-card__icon">📱</div>
            <div class="action-card__title">فحص الأجهزة</div>
            <div class="action-card__desc">عرض وإدارة الأجهزة المرتبطة بكل حساب</div>
            <div class="action-card__arrow">فتح ←</div>
          </a>
          <a href="/premium" class="action-card action-card--warning" data-link>
            <div class="action-card__icon">⭐</div>
            <div class="action-card__title">تفعيل البريميوم</div>
            <div class="action-card__desc">تفعيل أو تمديد اشتراك بريميوم لمستخدم بالبريد</div>
            <div class="action-card__arrow">فتح ←</div>
          </a>
        </div>
      `;
    }
  </script>
</body>
</html>
