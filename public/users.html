<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قائمة المشتركين — Quotes Pro Admin</title>
  <link rel="icon" href="/images/app_icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <script type="module">
    import { requireAuth, mountShell, callFunction, toast, escapeHTML } from "/js/common.js";

    let allUsers = [];
    let searchTerm = "";
    let premiumOnly = false;

    (async () => {
      await requireAuth();
      mountShell("/users", "قائمة المشتركين", "البحث وعرض المستخدمين المسجلين وحصص عروض الأسعار");
      document.getElementById("headerActions").innerHTML = `<button class="btn btn--outline" id="btnRefresh"><span>🔄</span> تحديث</button>`;
      document.getElementById("btnRefresh").addEventListener("click", loadUsers);
      document.getElementById("pageBody").innerHTML = `
        <div class="card mb-4"><div class="card__body" style="padding:16px;"><div class="form-row" style="grid-template-columns:1fr auto auto;align-items:end;"><div class="form-group" style="margin-bottom:0;"><label class="form-label" for="searchInput">بحث</label><input class="form-control" type="text" id="searchInput" placeholder="ابحث بالبريد، الاسم، أو UID..." /></div><label class="radio-card" style="margin-bottom:0;"><input type="checkbox" id="premiumOnly" /><span>⭐ البريميوم فقط</span></label><button class="btn btn--primary" id="btnSearch"><span>🔍</span> بحث</button></div></div></div>
        <div class="card"><div class="card__header"><div class="card__title"><span class="card__title-icon">👥</span><span>المستخدمون (<span id="userCount">0</span>)</span></div></div><div class="card__body" id="usersTableWrap"><div style="display:flex;align-items:center;justify-content:center;min-height:240px;"><div class="spinner spinner--lg"></div></div></div></div>
      `;
      document.getElementById("btnSearch").addEventListener("click", () => {
        searchTerm = document.getElementById("searchInput").value.trim();
        premiumOnly = document.getElementById("premiumOnly").checked;
        renderTable();
      });
      document.getElementById("searchInput").addEventListener("keypress", e => { if (e.key === "Enter") document.getElementById("btnSearch").click(); });
      await loadUsers();
    })();

    async function loadUsers() {
      const wrap = document.getElementById("usersTableWrap");
      wrap.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:240px;"><div class="spinner spinner--lg"></div></div>`;
      try {
        const data = await callFunction("getAllUsers", { limit: 300, premiumOnly: false });
        allUsers = data.users || [];
        renderTable();
      } catch (e) {
        wrap.innerHTML = `<div class="alert alert--error">${e.message}</div>`;
        toast(e.message, "error");
      }
    }

    function renderTable() {
      const wrap = document.getElementById("usersTableWrap");
      let list = allUsers;
      if (premiumOnly) list = list.filter(u => u.is_premium);
      if (searchTerm) {
        const s = searchTerm.toLowerCase();
        list = list.filter(u => (u.email || "").toLowerCase().includes(s) || (u.displayName || "").toLowerCase().includes(s) || (u.id || "").toLowerCase().includes(s));
      }
      document.getElementById("userCount").textContent = list.length;
      if (list.length === 0) {
        wrap.innerHTML = `<div class="empty"><div class="empty__icon">👥</div><div class="empty__text">لا يوجد مستخدمون مطابقون</div></div>`;
        return;
      }
      wrap.innerHTML = `<div class="table-wrap"><table class="table"><thead><tr><th>المستخدم</th><th>البريد الإلكتروني</th><th>الحالة</th><th>العروض / الحد الأقصى</th><th>تاريخ التسجيل</th><th>UID</th></tr></thead><tbody>${list.map(u => `<tr><td><strong>${escapeHTML(u.displayName) || "—"}</strong></td><td>${escapeHTML(u.email)}</td><td>${u.is_premium ? '<span class="badge badge--success">⭐ بريميوم</span>' : '<span class="badge badge--gray">مجاني</span>'}</td><td><span class="badge badge--info">${u.quotes_count} / ${u.max_quotes}</span></td><td><small>${escapeHTML(u.created_at) || "—"}</small></td><td><code style="font-size:11px;background:var(--bg-page);padding:2px 6px;border-radius:4px;">${escapeHTML(u.id).substring(0, 12)}...</code></td></tr>`).join("")}</tbody></table></div>`;
    }
  </script>
</body>
</html>
